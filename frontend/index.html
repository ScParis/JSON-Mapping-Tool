<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Devkit | Suite de Ferramentas Desenvolvedor & Studio</title>
  <meta name="description" content="Plataforma completa de ferramentas para desenvolvedores: JSON Mapper JMESPath, Diff Viewer, JWT & Hashes, Regex, SQL Toolset, Consulta CNPJ/CEP, API Tester e Universal Studio Pro.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#4f46e5">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('portal-theme');
        if (!t) {
          t = 'light';
          localStorage.setItem('portal-theme', 'light');
        }
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
